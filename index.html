<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">

      <!-- ── Header ── -->
      <header class="app-header">
        <h1>💸 Expense & Budget Visualizer</h1>
        <p class="subtitle">Catat pengeluaranmu, pantau keuanganmu.</p>
      </header>

      <!-- ── Form Input ── -->
      <section class="card form-card">
        <h2>Tambah Transaksi</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="item-name">Nama Item</label>
            <input
              type="text"
              id="item-name"
              placeholder="Contoh: Makan siang"
              autocomplete="off"
            />
            <span class="error-msg" id="error-name"></span>
          </div>

          <div class="form-group">
            <label for="amount">Jumlah (Rp)</label>
            <input
              type="number"
              id="amount"
              placeholder="Contoh: 25000"
              min="1"
            />
            <span class="error-msg" id="error-amount"></span>
          </div>

          <div class="form-group">
            <label for="category">Kategori</label>
            <select id="category">
              <option value="">-- Pilih Kategori --</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Fun">🎉 Fun</option>
            </select>
            <span class="error-msg" id="error-category"></span>
          </div>

          <button type="submit" class="btn-primary">+ Tambah</button>
        </form>
      </section>

      <!-- ── Summary & Chart ── -->
      <section class="card summary-card">
        <div class="total-box">
          <span class="total-label">Total Pengeluaran</span>
          <span class="total-amount" id="total-amount">Rp 0</span>
        </div>

        <div class="chart-wrapper">
          <h2>Distribusi per Kategori</h2>
          <div class="chart-container">
            <!-- SVG pie chart digenerate oleh JavaScript -->
            <svg id="pie-chart" viewBox="0 0 200 200" aria-label="Pie chart pengeluaran per kategori"></svg>
            <div class="legend" id="legend"></div>
          </div>
          <p class="empty-chart-msg" id="empty-chart-msg">Belum ada data untuk ditampilkan.</p>
        </div>
      </section>

      <!-- ── Daftar Transaksi ── -->
      <section class="card list-card">
        <h2>Daftar Transaksi</h2>
        <ul class="transaction-list" id="transaction-list">
          <!-- Item transaksi digenerate oleh JavaScript -->
        </ul>
        <p class="empty-list-msg" id="empty-list-msg">Belum ada transaksi.</p>
      </section>

    </div><!-- /container -->

    <script src="js/script.js"></script>
  </body>
</html>
